spring.application.name=TrustFlow
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/trustflow;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
trustflow.seed-demo=true
trustflow.ai.mode=${AI_MODE:http}
trustflow.ai.url=http://localhost:8000/predict
trustflow.notifications.mode=local
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=trustflow-notifications
spring.kafka.consumer.auto-offset-reset=earliest
