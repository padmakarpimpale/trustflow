<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TrustFlow</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
  </head>
  <body>
    <header th:replace="~{fragments :: nav}"></header>
    <main>
      <p class="notice" th:if="${aiMode == 'demo'}">
        Offline demonstration: recommendations use explicit demo rules, not a trained AI model.
      </p>
      <p class="success" th:if="${success}" th:text="${success}"></p>
      <p class="error" th:if="${error}" th:text="${error}"></p>
      <h1>Notifications</h1>
      <p th:if="${#lists.isEmpty(notifications)}">No notifications yet.</p>
      <article class="panel" th:each="n : ${notifications}">
        <a th:href="@{/cases/{id}(id=${n.caseId})}" th:text="${n.message}"></a>
        <p th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy HH:mm', 'UTC')}"></p>
        <form
          th:if="${!n.readFlag}"
          th:action="@{/notifications/{id}/read(id=${n.id})}"
          method="post"
        >
          <button class="secondary">Mark as read</button>
        </form>
        <span th:if="${n.readFlag}">Read</span>
      </article>
    </main>
    <footer>TrustFlow · Enterprise Application Development</footer>
  </body>
</html>
