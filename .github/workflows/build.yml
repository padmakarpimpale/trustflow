name: Build and test
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ai-service/requirements.txt
      - run: python train.py && python -m unittest -v && python evaluate.py
        working-directory: ai-service
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start Java Python MySQL and Kafka
        run: docker compose -f compose.yaml -f compose.integrated.yaml up --build -d
      - name: Verify migrations routing recovery and restore
        run: python3 scripts/integration-check.py
      - name: Save service logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f compose.yaml -f compose.integrated.yaml logs --no-color > test-results/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-evidence
          path: test-results/
      - name: Stop test stack
        if: always()
        run: docker compose -f compose.yaml -f compose.integrated.yaml down -v
