<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TrustFlow</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
  </head>
  <body>
    <header th:replace="~{fragments :: nav}"></header>
    <main>
      <p class="notice" th:if="${aiMode == 'demo'}">
        Offline demonstration: recommendations use explicit demo rules, not a trained AI model.
      </p>
      <p class="success" th:if="${success}" th:text="${success}"></p>
      <p class="error" th:if="${error}" th:text="${error}"></p>
      <h1>Submit a case</h1>
      <form class="panel" th:action="@{/cases/new}" th:object="${caseForm}" method="post">
        <ul class="error" th:if="${#fields.hasAnyErrors()}">
          <li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li>
        </ul>
        <label
          >Case type<select th:field="*{type}" required>
            <option value="">Choose a type</option>
            <option value="EXPENSE">Expense claim</option>
            <option value="ACCESS">IT access request</option>
          </select></label
        ><label>Title<input th:field="*{title}" maxlength="120" required /></label
        ><label
          >Justification<textarea
            th:field="*{description}"
            minlength="10"
            maxlength="2000"
            rows="5"
            required
          ></textarea></label
        ><label
          >Amount in SGD (expense claims only)<input
            th:field="*{amount}"
            type="number"
            min="0.01"
            max="9999999999.99"
            step="0.01" /></label
        ><label
          >Access level (access requests only)<select th:field="*{accessLevel}">
            <option value="">Not applicable</option>
            <option value="STANDARD">Standard access</option>
            <option value="ADMIN">Administrator access</option>
          </select></label
        >
        <p>Approval records a decision only. It does not transfer money or create an IT account.</p>
        <button>Submit case</button>
      </form>
    </main>
    <footer>TrustFlow · Enterprise Application Development</footer>
  </body>
</html>
