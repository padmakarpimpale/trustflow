<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TrustFlow</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
  </head>
  <body>
    <header th:fragment="nav">
      <a class="brand" th:href="@{/}">TrustFlow</a>
      <nav>
        <a th:href="@{/}">Dashboard</a><a th:href="@{/notifications}">Notifications</a
        ><a th:if="${currentUser.role.name() == 'SUBMITTER'}" th:href="@{/cases/new}">New case</a
        ><a th:if="${currentUser.role.name() == 'ADMIN'}" th:href="@{/admin/policies}">Policies</a>
      </nav>
      <span th:text="${currentUser.username + ' · ' + currentUser.role}"></span>
      <form th:action="@{/logout}" method="post"><button class="secondary">Sign out</button></form>
    </header>
  </body>
</html>
