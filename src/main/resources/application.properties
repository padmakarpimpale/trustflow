spring.application.name=TrustFlow
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/trustflow;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
trustflow.seed-demo=true
trustflow.ai.mode=${AI_MODE:http}
trustflow.ai.url=${AI_URL:http://localhost:8000/predict}
trustflow.notifications.mode=local
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=trustflow-notifications
spring.kafka.consumer.auto-offset-reset=earliest

# H2 remains useful for local tests. MySQL uses versioned migrations.
spring.flyway.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.group.readiness.include=readinessState,db
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Bound broker metadata waits; the outbox retries unsuccessful sends.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
